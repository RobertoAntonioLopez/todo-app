<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>To Do List:</h1>

    <form id="form-task">
        <label for="input-task">New Task</label>
        <input type="text" name="task" id="input-task" required>

        <button type="submit">Add</button>
    </form>

    <ul id="list-task"></ul>
</body>
</html>
