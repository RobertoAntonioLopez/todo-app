<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple and focused task manager by Roberto Antonio Lopez.">
    <title>FocusList | Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app">
        <header class="app-header">
            <div>
                <p class="eyebrow">Stay focused</p>
                <h1>Today’s tasks</h1>
                <p class="subtitle">Small steps turn into meaningful progress.</p>
            </div>

            <a class="github-link" href="https://github.com/robertoantoniolopez" target="_blank" rel="noopener noreferrer" aria-label="Visit Roberto Antonio Lopez on GitHub">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.78 1.2 1.78 1.2 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.47.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.58.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.71 5.39-5.29 5.68.42.36.79 1.06.79 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
                </svg>
            </a>
        </header>

        <form id="form-task">
            <label for="input-task" class="sr-only">New task</label>
            <input type="text" name="task" id="input-task" placeholder="What needs to be done?" maxlength="100" autocomplete="off" required>
            <button class="add-button" type="submit">Add task</button>
        </form>

        <section class="task-section" aria-live="polite">
            <div class="task-summary">
                <span id="task-count">0 tasks</span>
                <button id="clear-completed" class="text-button" type="button" hidden>Clear completed</button>
            </div>
            <p id="empty-state" class="empty-state">Your list is clear. Add a task to get started.</p>
            <ul id="list-task"></ul>
        </section>

        <footer>
            <span>Designed &amp; built by Roberto</span>
            <a href="https://robertoantoniolopez.github.io/portfolio/" target="_blank" rel="noopener noreferrer">View portfolio <span aria-hidden="true">&rarr;</span></a>
        </footer>
    </main>
</body>
</html>
